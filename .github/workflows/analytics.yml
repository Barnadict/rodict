name: Analytics

# Runs the Phase 4 Python analytics jobs against the hosted DB and writes the
# precomputed results into AnalyticsResult (the frontend only reads them).
#
# Runs on its own twice-daily cron, NOT after every collect (Task #45). It used
# to chain off each successful collect (8x/day), but survival, cohorts,
# seasonality and forecasts need days to weeks of history, so 3-hour freshness
# bought nothing while every run re-read the whole snapshot table (rows-read
# quota) and rewrote results (rows-written quota). 2x/day keeps the anomaly feed
# and momentum reasonably fresh. Scheduled at :50 past 00:00/12:00 UTC, so it
# lands between collect runs (every 3h on the hour, ~25 min each) rather than
# racing one. Manual runs still work via workflow_dispatch.

on:
  schedule:
    - cron: "50 0,12 * * *"
  workflow_dispatch:

# Never two analytics runs at once: overlapping runs would both diff against the
# same stored rows and double the reads. A new run waits for the current one.
concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r analytics/requirements.txt

      - name: Run analytics jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          # Turso's own usage counter for the write-budget guard (Task #81).
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORG: ${{ secrets.TURSO_ORG }}
          PYTHONIOENCODING: utf-8 # game names contain emoji; CI stdout must not choke
          # Print progress as it happens: buffered output is lost when a run is
          # killed by the timeout, which hid where the time went.
          PYTHONUNBUFFERED: "1"
        run: python analytics/run.py

  # Alert on failed runs (Task #34) — see the note in collect.yml.
  alert:
    needs: analytics
    if: failure() || cancelled()
    uses: ./.github/workflows/alert-on-failure.yml
    with:
      pipeline: analytics
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      issues: write
