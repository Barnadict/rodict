name: Collect

# Runs the data collector against the hosted DB on a schedule, so game/genre
# snapshot history keeps accumulating even when nobody is running `npm run
# collect` locally. Local scheduling (node-cron) was intentionally skipped as
# Task #12 in favor of this.

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours
  workflow_dispatch:
    inputs:
      knownOnly:
        description: "Skip keyword discovery, only re-collect known games"
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Headroom for a multi-thousand-game corpus: discovery walks the omni-search
    # tail + the explore-api charts, and the collector fetches/persists them all.
    # The bulk write path (persistCollectedGames) keeps the DB phase to seconds;
    # the API fetch is the long pole. 30 min is generous vs. the 3h cron gap.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Run collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: |
          # Scheduled runs stay in maintenance mode (--known-only). Discovery is
          # throttled to ~nothing on GitHub's datacenter IP, so the cron spends its
          # whole budget RE-COLLECTING known games (stalest first — see
          # getKnownUniverseIds) rather than wasting it on discovery it can't do.
          # Corpus GROWTH comes from manual `npm run collect:prod` on a residential
          # IP. A manual workflow_dispatch can still force a full-discovery run by
          # leaving knownOnly unchecked.
          # Scheduled runs --pace (Task #79): a run ahead of the month's even
          # write line is skipped, so collection spreads across the whole month.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npm run collect -- --known-only --pace
          elif [ "${{ inputs.knownOnly }}" = "true" ]; then
            npm run collect -- --known-only
          else
            npm run collect
          fi

  # Alert on failed runs (Task #34) — these run unattended on a cron, so a red
  # tab nobody checks isn't a signal. `cancelled()` too (Task #49): a job that
  # hits `timeout-minutes` ends as "cancelled", not "failure", which is how 229
  # timed-out analytics runs never raised an alert. (A run cancelled by hand
  # also alerts; close that issue.)
  alert:
    needs: collect
    if: failure() || cancelled()
    uses: ./.github/workflows/alert-on-failure.yml
    with:
      pipeline: collect
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      issues: write
