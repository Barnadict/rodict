name: Collect

# Runs the data collector against the hosted DB on a schedule, so game/genre
# snapshot history keeps accumulating even when nobody is running `npm run
# collect` locally. Local scheduling (node-cron) was intentionally skipped as
# Task #12 in favor of this.

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours
  workflow_dispatch:
    inputs:
      knownOnly:
        description: "Skip all discovery, only re-collect known games"
        type: boolean
        default: false
      chartsOnly:
        description: "Discover from the explore charts only (keyword search is 429'd here)"
        type: boolean
        default: true

jobs:
  collect:
    runs-on: ubuntu-latest
    # Headroom for a multi-thousand-game corpus: discovery walks the omni-search
    # tail + the explore-api charts, and the collector fetches/persists them all.
    # The bulk write path (persistCollectedGames) keeps the DB phase to seconds;
    # the API fetch is the long pole. 30 min is generous vs. the 3h cron gap.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Run collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          # Turso's own usage counter for the write-budget guard (Task #81).
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORG: ${{ secrets.TURSO_ORG }}
        run: |
          # Scheduled runs discover from the explore-api charts only
          # (--charts-only). The 2026-09-30 discovery probe (Task #94) got a 429
          # on every omni-search query from GitHub's datacenter IP but none on
          # the charts (~5 requests a run, a few new games each, Up-and-Coming
          # included). Keyword-search growth comes from the weekly residential
          # `npm run collect:prod` task (README, "Weekly discovery").
          # Scheduled runs also --pace (Task #79): a run ahead of the month's
          # even write line is skipped, so collection spreads across the month.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npm run collect -- --charts-only --pace
          elif [ "${{ inputs.knownOnly }}" = "true" ]; then
            npm run collect -- --known-only
          elif [ "${{ inputs.chartsOnly }}" = "true" ]; then
            npm run collect -- --charts-only
          else
            npm run collect
          fi

  # Alert on failed runs (Task #34) — these run unattended on a cron, so a red
  # tab nobody checks isn't a signal. `cancelled()` too (Task #49): a job that
  # hits `timeout-minutes` ends as "cancelled", not "failure", which is how 229
  # timed-out analytics runs never raised an alert. (A run cancelled by hand
  # also alerts; close that issue.)
  alert:
    needs: collect
    if: failure() || cancelled()
    uses: ./.github/workflows/alert-on-failure.yml
    with:
      pipeline: collect
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      issues: write
